services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./services/central-api/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthcore}
      POSTGRES_USER: ${POSTGRES_USER:-healthcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthcore_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - healthcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    build:
      context: ./services/central-api
      target: production
    env_file:
      - ./services/central-api/.env
    environment:
      APP_ENVIRONMENT: development
    command:
      - sh
      - -c
      - >-
        uv run --no-sync alembic upgrade head
        && uv run --no-sync seed-catalogs
        && uv run --no-sync seed-reference-data
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./services/central-api
      target: production
    env_file:
      - ./services/central-api/.env
    environment:
      APP_ENVIRONMENT: development
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db-init:
        condition: service_completed_successfully

  backoffice:
    image: nginx:1.27-alpine
    ports:
      - "${BACKOFFICE_PORT:-8080}:80"
    volumes:
      - ./uis/backoffice/operational-incidents:/usr/share/nginx/html:ro
    depends_on:
      - api

  test:
    profiles: ["test"]
    build:
      context: ./services/central-api
      target: test
    env_file:
      - ./services/central-api/.env
    environment:
      APP_ENVIRONMENT: test
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  healthcore-postgres-data:
