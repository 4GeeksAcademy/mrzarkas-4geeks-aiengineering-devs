services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./services/central-api/.env
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-healthcore}"
      POSTGRES_USER: "${POSTGRES_USER:-healthcore}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-healthcore_dev_password}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - healthcore-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/central-api
    env_file:
      - ./services/central-api/.env
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER:-healthcore}:${POSTGRES_PASSWORD:-healthcore_dev_password}@postgres:5432/${POSTGRES_DB:-healthcore}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  healthcore-postgres-data: